name: Build Cog (aarch64, Mali GBM fix)

on:
  workflow_dispatch:
  push:
    branches: [ mali-gbm-fix ]

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for aarch64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build inside emulated aarch64 Debian trixie
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            debian:trixie \
            bash -c '
              set -e
              apt-get update -q -y
              apt-get install -q -y --no-install-recommends \
                build-essential meson ninja-build pkg-config git file \
                libwpe-1.0-dev libwpebackend-fdo-1.0-dev \
                libwpewebkit-2.0-dev \
                libepoxy-dev libdrm-dev libinput-dev libudev-dev \
                libgbm-dev libegl-dev libgles2-mesa-dev \
                libglib2.0-dev libsoup-3.0-dev libmanette-0.2-dev \
                libwayland-dev libwayland-server0
              cd /workspace
              meson setup build --prefix=/usr -Dplatforms=drm -Dexamples=false
              ninja -C build
              mkdir -p /workspace/artifacts
              cp build/launcher/cog /workspace/artifacts/ || true
              cp build/launcher/cogctl /workspace/artifacts/ || true
              find build -iname "*drm*.so*" -exec cp -v {} /workspace/artifacts/ \;
              find build -iname "libcogcore.so*" -exec cp -v {} /workspace/artifacts/ \;
              echo "=== Verifying architecture of built artifacts ==="
              file /workspace/artifacts/*
            '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cog-aarch64-mali-fix
          path: artifacts/*
